"$schema" = 'https://starship.rs/config-schema.json'

# Tones pad
# Powerline prompt in the Srcery palette.
#
#   ╭─  macOS  dir  git branch ⇣⇡ * ~ + ! ? ▶            ◀ runtime ▶◀ status ◀ clock
#   ╰─
#
# Git status follows Powerlevel10k: behind/ahead arrows with counts, then stash,
# merge state, conflicts, staged, modified, renamed, deleted, and untracked.
#
# The right side is reserved for runtime info (language versions, command duration).
# That block is one conditional group: it draws its arrows only when it has content.
#
# Palette:
#   yellow #fbb829   green #98bc37   magenta #ff5c8f   blue #68a8e4   red #f75341
#   ink #1c1b19     panel #303030    light #fce8c3     muted #918175
#
# Arrows are \ue0b0 (right) and \ue0b2 (left). The right side sits on line 1 via
# $fill, because starship's right_format always lands on the last line.

add_newline = true

format = """
[╭─](fg:#918175)\
$os\
[\ue0b0](fg:#fce8c3 bg:#fbb829)\
$directory\
$git_branch\
$git_status\
$git_state\
${custom.end_git}\
${custom.end_dir}\
$fill\
([\ue0b2](fg:#ff5c8f)\
$nodejs\
$bun\
$golang\
$rust\
$php\
$cmd_duration\
[ ](bg:#ff5c8f)[\ue0b0](fg:#ff5c8f))\
[\ue0b2](fg:#303030)\
$status\
[\ue0b2](fg:#68a8e4 bg:#303030)\
$time\
$line_break\
[╰─ ](fg:#918175)\
$character"""

# Green caret, red after a failed command.
[character]
success_symbol = '[❯](bold fg:#98bc37)'
error_symbol = '[❯](bold fg:#f75341)'

[fill]
symbol = ' '

[os]
disabled = false
style = 'bg:#fce8c3 fg:#1c1b19'
format = '[ $symbol ]($style)'

[os.symbols]
Macos = "\uf179"

[directory]
style = 'bg:#fbb829 fg:#1c1b19'
format = '[ $path$read_only ]($style)'
read_only = " \uf023"
truncation_length = 3
truncation_symbol = '…/'

# Each git piece draws its own leading arrow, so nothing is left dangling outside a repo.
[git_branch]
symbol = "\ue0a0"
format = "([\ue0b0](fg:#fbb829 bg:#98bc37)[ $symbol $branch ](bg:#98bc37 fg:#1c1b19))"

[git_status]
format = '([$ahead_behind$stashed$conflicted$staged$modified$renamed$deleted$untracked](bg:#98bc37 fg:#1c1b19))'
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇣${behind_count}⇡${ahead_count} '
stashed = '*${count} '
conflicted = '~${count} '
staged = '+${count} '
modified = '!${count} '
renamed = '»${count} '
deleted = '✘${count} '
untracked = '?${count} '

# rebase / merge / cherry-pick, same slot p10k uses for VCS_STATUS_ACTION.
[git_state]
format = '[$state( $progress_current/$progress_total) ](bg:#98bc37 fg:#1c1b19)'

# Ends the left side: green arrow in a repo, yellow arrow outside one.
[custom.end_git]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'true'
format = "[\ue0b0](fg:#98bc37)"

[custom.end_dir]
when = '! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'true'
format = "[\ue0b0](fg:#fbb829)"

[status]
disabled = false
symbol = "✘ "
success_symbol = "✔"
success_style = 'bg:#303030 fg:#98bc37'
failure_style = 'bg:#303030 fg:#f75341'
format = '[ $symbol$maybe_int ]($style)'

# Runtime info. Each module starts with a space; the group adds the trailing one.
[nodejs]
symbol = "\ue718 "
format = '[ $symbol($version)](bg:#ff5c8f fg:#1c1b19)'

[bun]
symbol = 'bun '
format = '[ $symbol($version)](bg:#ff5c8f fg:#1c1b19)'

[golang]
symbol = "\ue626 "
format = '[ $symbol($version)](bg:#ff5c8f fg:#1c1b19)'

[rust]
symbol = "\ue7a8 "
format = '[ $symbol($version)](bg:#ff5c8f fg:#1c1b19)'

[php]
symbol = "\ue73d "
format = '[ $symbol($version)](bg:#ff5c8f fg:#1c1b19)'

[cmd_duration]
min_time = 2000
format = '[ took $duration](bg:#ff5c8f fg:#1c1b19)'

[time]
disabled = false
time_format = '%I:%M %p'
style = 'bg:#68a8e4 fg:#1c1b19'
format = "[ $time \uf017 ]($style)"
